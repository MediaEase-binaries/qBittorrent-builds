name: Build qBittorrent

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      version:
        description: "qBittorrent version to build"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "5.2.0"
          - "5.1.4"

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generating matrix
        id: generate
        run: |
          pip3 install --upgrade pyyaml
          echo "Generating matrix..."
          MATRIX=$(python3 matrix.py)
          echo "$MATRIX" > matrix.json
          echo "matrix<<EOF" >> $GITHUB_ENV
          cat matrix.json >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Filter matrix for workflow_dispatch
        run: |
          pip3 install --upgrade pyyaml
          python3 << 'PY'
          import os, sys, yaml
          key = os.environ["MATRIX_VERSION_KEY"]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          sel = os.environ.get("WF_VERSION", "all")
          with open("matrix.json") as f:
              data = yaml.safe_load(f)
          inc = list(data.get("include") or [])
          if event == "workflow_dispatch" and sel and sel != "all":
              inc = [r for r in inc if str(r.get(key)) == sel]
              if not inc:
                  sys.stderr.write(f"::error::No matrix entry where {key}={sel!r}\n")
                  sys.exit(1)
          with open("matrix.json", "w") as f:
              yaml.safe_dump({"include": inc}, f, sort_keys=False)
          print(yaml.safe_dump({"include": inc}, sort_keys=False))
          PY
          {
            echo 'matrix<<EOF'
            cat matrix.json
            echo 'EOF'
          } >> "$GITHUB_ENV"
        env:
          MATRIX_VERSION_KEY: version
          WF_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'all' }}

      - name: Setup matrix
        id: set
        uses: druzsan/setup-matrix@v2
        with:
          matrix: |
            ${{ env.matrix }}

  build:
    name: v${{ matrix.version }} (${{ matrix.os }})
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      max-parallel: 8
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      PACKAGE_NAME: qbittorrent-nox
      PACKAGE_VERSION: ${{ matrix.version }}
      BINARY_URL: ${{ matrix.binary_url }}
      DEB_PACKAGE_NAME: ${{ matrix.deb_package_name }}
      INSTALL_BASE: ${{ matrix.install_base }}
      LIBTORRENT_VERSION: ${{ matrix.libtorrent_version }}
      CODENAME: ${{ matrix.distro }}

    steps:
      - name: Install basic dependencies
        run: |
          apt-get update -qq
          # Repack static binary only: curl/gh release fetch, strip/upx, dpkg-deb — no compiler toolchain
          apt-get install -yqq --no-install-recommends \
            ca-certificates curl wget jq git \
            debconf-utils dpkg-dev \
            binutils \
            upx-ucl

      - name: Checkout tools repository
        uses: actions/checkout@v6
        with:
          repository: krate-binaries/tools
          path: tools

      - name: Prepare tools scripts
        run: find tools/ -name "*.sh" -exec chmod +x {} +

      - name: Create package directory structure
        run: |
          PKG_DIR="${GITHUB_WORKSPACE}/qbittorrent-pkg"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}${{ env.INSTALL_BASE }}/usr/bin"
          echo "PKG_DIR=${PKG_DIR}" >> "$GITHUB_ENV"
          echo "PACKAGE_ROOT=${PKG_DIR}${{ env.INSTALL_BASE }}" >> "$GITHUB_ENV"

      - name: Download qBittorrent binary
        run: |
          echo "Downloading binary from ${{ env.BINARY_URL }}"
          curl -L "${{ env.BINARY_URL }}" -o "${{ env.PACKAGE_ROOT }}/usr/bin/qbittorrent-nox"
          RELEASE_URL="https://api.github.com/repos/userdocs/qbittorrent-nox-static/releases/tags/release-${{ env.PACKAGE_VERSION }}_v${{ env.LIBTORRENT_VERSION }}"
          COMPONENTS=$(curl -s -H "Accept: application/vnd.github.v3+json" "$RELEASE_URL" \
            | jq -r .body \
            | sed -n '/| Components/,/| *zlib-ng/p' \
            | sed '1,2d;$d')
          echo "$COMPONENTS" > components.txt
          if [ -f "${{ env.PACKAGE_ROOT }}/usr/bin/qbittorrent-nox" ]; then
            chmod +x "${{ env.PACKAGE_ROOT }}/usr/bin/qbittorrent-nox"
            if file "${{ env.PACKAGE_ROOT }}/usr/bin/qbittorrent-nox" | grep -q "ELF.*executable"; then
              strip --strip-unneeded "${{ env.PACKAGE_ROOT }}/usr/bin/qbittorrent-nox"
              if command -v upx >/dev/null 2>&1; then
                upx --best --lzma "${{ env.PACKAGE_ROOT }}/usr/bin/qbittorrent-nox"
              fi
            else
              echo "Warning: File is not an ELF executable, skipping strip and upx"
            fi
          else
            echo "Error: Binary file not found at ${{ env.PACKAGE_ROOT }}/usr/bin/qbittorrent-nox"
            exit 1
          fi

      - name: Setup control file
        run: |
          cp tools/packages/qbittorrent/control "${{ env.PKG_DIR }}/DEBIAN/control"
          sed -i "s/@ARCHITECTURE@/amd64/" "${{ env.PKG_DIR }}/DEBIAN/control"
          sed -i "s/@VERSION@/${{ env.PACKAGE_VERSION }}/" "${{ env.PKG_DIR }}/DEBIAN/control"
          sed -i "s/@REVISION@/1/" "${{ env.PKG_DIR }}/DEBIAN/control"
          sed -i "s/@MAINTAINER_NAME@/${{ secrets.COMMITTER_NAME }}/" "${{ env.PKG_DIR }}/DEBIAN/control"
          sed -i "s/@MAINTAINER_EMAIL@/${{ secrets.COMMITTER_EMAIL }}/" "${{ env.PKG_DIR }}/DEBIAN/control"
          cp tools/packages/qbittorrent/postinst "${{ env.PKG_DIR }}/DEBIAN/postinst"
          cp tools/packages/qbittorrent/prerm "${{ env.PKG_DIR }}/DEBIAN/prerm"
          chmod 755 "${{ env.PKG_DIR }}/DEBIAN/postinst" "${{ env.PKG_DIR }}/DEBIAN/prerm"
          (
            cd "${{ env.PKG_DIR }}"
            find . -type f ! -path './DEBIAN/*' -exec md5sum {} \; > DEBIAN/md5sums
          )
          mkdir -p "${{ env.PACKAGE_ROOT }}/usr/share/krate/apt-preferences"
          cp tools/packages/qbittorrent/apt-preferences.pref "${{ env.PACKAGE_ROOT }}/usr/share/krate/apt-preferences/qbittorrent-nox.pref"

      - name: Building package and metadata files
        run: |
          mkdir -p artifacts
          cd artifacts
          PACKAGE_NAME="${{ env.DEB_PACKAGE_NAME }}"
          dpkg-deb --build -Zxz -z9 -Sextreme --root-owner-group "${{ env.PKG_DIR }}" "${PACKAGE_NAME}"
          components_json="["
          while IFS='|' read -r _ component version _; do
            comp=$(echo "$component" | xargs)
            ver=$(echo "$version" | xargs)
            if [ -n "$comp" ] && [ -n "$ver" ]; then
              components_json="${components_json}{\"name\":\"$comp\",\"version\":\"$ver\"},"
            fi
          done < ../components.txt
          components_json="${components_json%,}]"
          ../tools/generate_metadata.sh \
            --category "qbittorrent" \
            --tag "release" \
            --version "${{ env.PACKAGE_VERSION }}" \
            --os "${{ matrix.codename }}" \
            --extra "install_base=${{ env.INSTALL_BASE }}" \
            --extra "components=${components_json}" \
            "${PACKAGE_NAME}"

      - name: Upload as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          retention-days: 2

  release:
    name: Create Releases
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ["5.2.0", "5.1.4"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout tools repository
        uses: actions/checkout@v6
        with:
          repository: krate-binaries/tools
          path: tools

      - name: Download artifacts for this version
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts
          pattern: krate-qbittorrent*${{ matrix.version }}*

      - name: Prepare release assets
        id: prepare-release-assets
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f \
            \( -name "krate-qbittorrent*${{ matrix.version }}*.deb" -o \
              -name "krate-qbittorrent*${{ matrix.version }}*.json" \) \
            -exec cp {} release_assets/ \;
          if [[ -z "$(ls release_assets/*.deb 2>/dev/null)" ]]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip_release=false" >> $GITHUB_OUTPUT
          pip3 install --upgrade pyyaml
          python3 tools/ci/release_notes.py \
            --product qbittorrent \
            --version "${{ matrix.version }}" \
            --assets-dir release_assets \
            --github-output

      - name: Create Release
        if: steps.prepare-release-assets.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ matrix.version }}
          name: qBittorrent ${{ matrix.version }}
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ${{ steps.prepare-release-assets.outputs.release_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
